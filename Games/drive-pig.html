<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive PIG</title>
  <style>
    :root { --ink: #15213b; --paper: #fff6df; --pink: #f4518d; --pink-dark: #bd235d; --sun: #ffc83d; --sky: #63c5e8; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: var(--ink); color: var(--ink); font-family: "Trebuchet MS", sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #topbar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none; }
    .panel { background: rgba(255, 246, 223, .92); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 8px 11px; }
    #level { font-size: clamp(14px, 2.2vw, 21px); font-weight: 900; letter-spacing: 0; }
    #countdown { color: #b33555; font-size: 12px; font-weight: 800; margin-top: 2px; }
    #controls { font-size: 12px; font-weight: bold; text-align: right; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(21, 33, 59, .38); }
    #card { width: min(570px, 100%); background: var(--paper); border: 4px solid var(--ink); box-shadow: 9px 9px 0 var(--ink); padding: clamp(20px, 5vw, 38px); text-align: center; }
    h1 { color: var(--pink-dark); font-size: clamp(34px, 7vw, 62px); line-height: .88; margin: 0; letter-spacing: 0; text-transform: uppercase; }
    #message { margin: 18px 0; font-weight: bold; line-height: 1.35; }
    #world-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 12px 0 4px; }
    #world-buttons button { font-size: 12px; }
    #level-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 16px 0; }
    button { border: 3px solid var(--ink); background: white; color: var(--ink); cursor: pointer; font: 800 15px "Trebuchet MS", sans-serif; min-height: 38px; padding: 7px 11px; box-shadow: 3px 3px 0 var(--ink); }
    button:disabled { cursor: not-allowed; opacity: .42; box-shadow: 1px 1px 0 var(--ink); }
    button:hover, button:focus-visible { background: var(--sun); outline: none; transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
    .daily { background: var(--pink); color: white; }
    #play { background: var(--sun); min-width: 170px; margin-top: 7px; }
    .hidden { display: none !important; }
    @media (max-width: 500px) { #controls { display: none; } #topbar { top: 8px; left: 8px; right: 8px; } .panel { padding: 6px 8px; } }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Drive Mad Pig driving game"></canvas>
  <div id="topbar" class="hidden">
    <div class="panel"><div id="level"></div><div id="countdown"></div></div>
    <div id="controls" class="panel">RIGHT / D: GO<br>LEFT / A: BRAKE &amp; FLIP<br>SPACE: JUMP &nbsp; DOWN / S: SQUAT<br>R: RESTART</div>
  </div>
  <div id="overlay">
    <main id="card">
      <h1>Drive Mad<br>Pig Edition</h1>
      <p id="message">Five worlds. Twenty-five harder courses. Dodge themed hazards, jump with SPACE, and squat with DOWN / S.</p>
      <div id="world-buttons"></div>
      <div id="level-buttons"></div>
      <button id="daily" class="daily">Daily Challenge</button>
      <br><button id="play">Choose a level</button>
    </main>
  </div>
  <script>
    "use strict";
    const canvas = document.querySelector("#game");
    const context = canvas.getContext("2d");
    const overlay = document.querySelector("#overlay");
    const topbar = document.querySelector("#topbar");
    const levelLabel = document.querySelector("#level");
    const countdown = document.querySelector("#countdown");
    const message = document.querySelector("#message");
    const worldButtons = document.querySelector("#world-buttons");
    const levelButtons = document.querySelector("#level-buttons");
    const play = document.querySelector("#play");
    const daily = document.querySelector("#daily");
    const keys = new Set();
    const segment = 72;
    let width = 0, height = 0, selectedLevel = 1, selectedWorld = 0, playing = false, isDaily = false;
    let unlockedLevel = Math.max(1, Math.min(25, Number(localStorage.getItem("drive-pig-unlocked-level") || 1)));
    let terrain = [], hazards = [], finish = 0, car, courseName = "", cameraX = 0, jumpQueued = false, bossTimer = 0;
    let particles = [], skidMarks = [], shake = 0, lastTime = performance.now();

    function resize() { width = canvas.width = innerWidth * devicePixelRatio; height = canvas.height = innerHeight * devicePixelRatio; context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
    addEventListener("resize", resize); resize();

    function localDayKey() { const now = new Date(); return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`; }
    function seedForToday() { return [...localDayKey()].reduce((seed, character) => ((seed * 31) + character.charCodeAt(0)) >>> 0, 2166136261); }
    function seededRandom(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let value = Math.imul(seed ^ (seed >>> 15), 1 | seed); value ^= value + Math.imul(value ^ (value >>> 7), 61 | value); return ((value ^ (value >>> 14)) >>> 0) / 4294967296; }; }
    function secondsUntilTomorrow() { const now = new Date(), tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1); return Math.max(0, Math.floor((tomorrow - now) / 1000)); }
    function updateCountdown() { const seconds = secondsUntilTomorrow(), hours = String(Math.floor(seconds / 3600)).padStart(2, "0"), minutes = String(Math.floor(seconds % 3600 / 60)).padStart(2, "0"), secs = String(seconds % 60).padStart(2, "0"); countdown.textContent = isDaily ? `NEW COURSE IN ${hours}:${minutes}:${secs}` : ""; }
    setInterval(updateCountdown, 1000);

    function addPoint(x, y) { terrain.push({ x, y }); return x; }
    function flat(x, y, amount = 1) { for (let index = 0; index < amount; index++) x = addPoint(x + segment, y); return x; }
    function pattern(x, base, values, hazard = "") { values.forEach(value => { x = addPoint(x + segment, base - value); }); if (hazard) hazards.push({ x: x - values.length * segment / 2, type: hazard }); return x; }
    const patterns = [
      (x, y) => pattern(x, y, [0, 25, 52, 20, 0], "bump"),
      (x, y) => pattern(x, y, [0, 30, 65, 95, 95, 65, 30, 0], "stairs"),
      (x, y) => pattern(x, y, [0, -30, -78, -78, -38, 5, 0], "pit"),
      (x, y) => pattern(x, y, [0, 40, 0, 55, 0, 42, 0], "hills"),
      (x, y) => pattern(x, y, [0, 68, 0, 82, 0, 64, 0], "teeth"),
      (x, y) => pattern(x, y, [0, 38, 80, 132, 172, 110, 40, 0], "peak"),
      (x, y) => pattern(x, y, [0, 20, 50, 90, 140, 76, 16, 0], "ramp"),
      (x, y) => pattern(x, y, [0, -34, -75, -44, 18, 48, 12, 0], "dip"),
      (x, y) => pattern(x, y, [0, 42, 13, 72, 20, 100, 26, 76, 0], "chaos")
    ];
    const worlds = [
      { name: "FREEZER", color: "#bdefff", accent: "#3f8ec4", hazard: "icicle", levels: ["Cold Start", "Slippery Shift", "Icicle Alley", "Whiteout Run", "Frozen Finale"] },
      { name: "STOVE", color: "#ffd39a", accent: "#d96c21", hazard: "butter", levels: ["Warm Up", "Butter Gap", "Pan Panic", "Kitchen Climb", "Boiling Point"] },
      { name: "FIRE", color: "#ffb36b", accent: "#d43820", hazard: "fireball", levels: ["Spark Sprint", "Ember Road", "Flame Flight", "Inferno Hills", "Firestorm"] },
      { name: "SMOKEHOUSE", color: "#b8b0a8", accent: "#5f5148", hazard: "smoke", levels: ["Smolder Start", "Haze Maze", "Low Smoke", "Choking Point", "Smokehouse Finale"] },
      { name: "HUMAN", color: "#ffd0b8", accent: "#9f3d43", hazard: "hand", levels: ["Kitchen Table", "Human Steps", "Palm Pressure", "Panic Underfoot", "THE GIANT HAND"] }
    ];

    function worldForLevel(level) { return Math.floor((level - 1) / 5); }
    function levelInWorld(level) { return ((level - 1) % 5) + 1; }
    const levelSignatures = [
      "snowdrift", "icepatch", "icicle", "whiteout", "crystal",
      "flame", "butter", "pan", "steam", "water",
      "spark", "ember", "flame", "lava", "firestorm",
      "coal", "smokering", "lowSmoke", "smokepillar", "smokefinale",
      "plate", "foot", "palm", "stomp", "hand"
    ];
    const obstacleProfiles = [
      [1.65, 1.45], [0.78, 0.72], [1.3, 1.1], [0.7, 0.68], [1.5, 1.35],
      [0.82, 0.76], [1.45, 1.2], [0.72, 0.7], [1.2, 1.05], [0.62, 1.75],
      [1.55, 1.4], [0.8, 0.72], [1.25, 1.08], [0.68, 0.62], [1.45, 1.25],
      [0.86, 0.78], [1.35, 1.15], [0.74, 0.68], [1.15, 1.0], [0.6, 0.55],
      [1.6, 1.4], [0.8, 0.7], [1.25, 1.05], [0.7, 0.62], [1.35, 1.15]
    ];
    function signatureForLevel(level) { return levelSignatures[level - 1]; }
    function obstacleProfileForLevel(level) { return obstacleProfiles[level - 1] || [1, 1]; }
    function renderLevelLocks() {
      [...levelButtons.querySelectorAll("button")].forEach((button, index) => {
        const level = index + 1;
        button.hidden = worldForLevel(level) !== selectedWorld;
        button.disabled = level > unlockedLevel;
        button.title = button.disabled ? "Finish the previous level to unlock this course." : "Play this course";
      });
    }
    function unlockNextLevel() {
      if (!isDaily && selectedLevel === unlockedLevel && unlockedLevel < worlds.length * 5) {
        unlockedLevel += 1;
        localStorage.setItem("drive-pig-unlocked-level", String(unlockedLevel));
        renderLevelLocks();
      }
    }
    function addWorldHazards(worldIndex, level, ground, end) {
      const world = worlds[worldIndex];
      const difficulty = levelInWorld(level);
      const [sharedMultiplier, signatureMultiplier] = obstacleProfileForLevel(level);
      if (world.hazard !== "hand") {
        const spacing = Math.max(segment * 2.4, segment * (4.2 - difficulty * .18) * sharedMultiplier);
        let icicleIndex = 0;
        for (let x = segment * 12; x < end - segment * 4; x += spacing) {
          const hazard = { x, type: world.hazard, phase: (x / segment) % 2, difficulty };
          if (world.hazard === "icicle") hazard.requiresSquat = icicleIndex++ % 2 === 1;
          if (world.hazard === "butter" && difficulty !== 3 && difficulty !== 5) hazard.gap = terrainAt(x) - 220;
          if (world.hazard === "fireball") hazard.y = ground - 85 - ((x / segment) % 3) * 38;
          if (world.hazard === "scythe") hazard.y = terrainAt(x) - 78;
          if (world.hazard === "smoke") hazard.y = ground - 10;
          if (world.hazard !== "butter" || (difficulty !== 3 && difficulty !== 5)) hazards.push(hazard);
          if (world.hazard === "butter") hazards.push({ x: x + spacing * .5, type: "vent", phase: (x / segment) % 3, difficulty });
        }
      }
      const signature = signatureForLevel(level);
      const signatureSpacing = Math.max(segment * 3.2, segment * (5.6 - difficulty * .25) * signatureMultiplier);
      for (let x = segment * 15; x < end - segment * 3; x += signatureSpacing) {
        hazards.push({ x, type: "signature", signature, phase: (x / segment) % 4, difficulty });
      }
    }

    function buildCourse(level, dailyMode) {
      const worldIndex = worldForLevel(level), world = worlds[worldIndex];
      const ground = Math.round(innerHeight * .72), random = dailyMode ? seededRandom(seedForToday()) : null;
      terrain = [{ x: 0, y: ground }]; hazards = []; let x = 0;
      x = flat(x, ground, 8);
      const count = dailyMode ? 11 : level === 1 ? 5 : 5 + levelInWorld(level) * 2 + worldIndex;
      for (let index = 0; index < count; index++) {
        const patternIndex = dailyMode
          ? Math.floor(random() * patterns.length)
          : level === 1 ? (index % 2 === 0 ? 0 : 3) : (level + index * 2) % patterns.length;
        x = patterns[patternIndex](x, ground);
        x = flat(x, ground, dailyMode ? 1 : 2);
      }
      x = flat(x, ground, 9); finish = x - segment * 3;
      addWorldHazards(worldIndex, level, ground, finish);
      courseName = dailyMode ? `DAILY CHALLENGE: ${localDayKey()}` : `${world.name} ${levelInWorld(level)}: ${world.levels[levelInWorld(level) - 1]}`;
      car = { x: segment * 3, y: ground - 26, vx: 0, vy: 0, angle: 0, spin: 0, squat: false, grounded: true, crashed: false, won: false, wheelSpin: 0, airtime: 0 };
      cameraX = 0;
      jumpQueued = false;
      bossTimer = 0;
      particles = []; skidMarks = []; shake = 0;
    }

    function terrainAt(x) {
      if (x <= terrain[0].x) return terrain[0].y;
      for (let index = 0; index < terrain.length - 1; index++) { const first = terrain[index], second = terrain[index + 1]; if (x <= second.x) { const amount = (x - first.x) / (second.x - first.x); return first.y + (second.y - first.y) * amount; } }
      return terrain[terrain.length - 1].y;
    }
    function normalizeAngle(angle) { return Math.atan2(Math.sin(angle), Math.cos(angle)); }
    function slopeAt(x) { return Math.atan2(terrainAt(x + 22) - terrainAt(x - 22), 44); }
    function particleBurst(x, y, count, type = "dust") {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 1;
        particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s-1.5, life: 1, size: Math.random()*5+2, type});
      }
    }
    function updateEffects() {
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .98; p.life -= .035; });
      particles = particles.filter(p => p.life > 0);
      skidMarks = skidMarks.filter(m => m.life-- > 0);
      shake *= .88;
    }
    function startGame() {
      if (!isDaily && selectedLevel > unlockedLevel) {
        message.textContent = "Finish the previous level to unlock this course.";
        return;
      }
      buildCourse(selectedLevel, isDaily); playing = true; overlay.classList.add("hidden"); topbar.classList.remove("hidden"); levelLabel.textContent = courseName; updateCountdown();
    }
    function showMenu(text) { playing = false; topbar.classList.add("hidden"); overlay.classList.remove("hidden"); message.textContent = text; play.textContent = "Play selected level"; }

    function crash(text) {
      if (car.crashed || car.won) return;
      car.crashed = true;
      shake = 16;
      particleBurst(car.x, car.y, 28, "impact");
      setTimeout(() => showMenu(text), 850);
    }

    function checkHazards(view) {
      const world = worlds[worldForLevel(selectedLevel)];
      const carScreenX = car.x - view;
      for (const hazard of hazards) {
        if (hazard.type === "icicle") {
          const icicleTip = terrainAt(hazard.x) - 80;
          const carTop = car.y - 25, carBottom = car.y + 25;
          const touchesIcicle = Math.abs(car.x - hazard.x) < 30 && carTop < icicleTip && carBottom > 0;
          if (touchesIcicle && (!hazard.requiresSquat || !car.squat)) crash(hazard.requiresSquat ? "Squat under this icicle!" : "The icicles got the pig car. Pick a course and try again.");
        } else if (hazard.type === "butter") {
          const localGround = terrainAt(hazard.x), upperBottom = hazard.gap + 16, lowerTop = hazard.gap + 204;
          const hitsUpperColumn = car.y - 18 < upperBottom;
          const hasLowerColumn = lowerTop < localGround - 24;
          const hitsLowerColumn = hasLowerColumn && car.y + 18 > lowerTop;
          if (Math.abs(car.x - hazard.x) < 18 && (hitsUpperColumn || hitsLowerColumn)) crash("Splat. The butter columns closed the gap.");
        } else if (hazard.type === "fireball") {
          const y = hazard.y + Math.sin((performance.now() / 240) + hazard.phase) * 14;
          if (Math.hypot(car.x - hazard.x, car.y - y) < 34) crash("A fireball hit the pig car. Pick a course and try again.");
        } else if (hazard.type === "scythe") {
          const y = terrainAt(hazard.x) - 78;
          if (Math.hypot(car.x - hazard.x, car.y - y) < 48) crash("The reaper's scythe caught the pig car.");
        } else if (hazard.type === "smoke") {
          const y = terrainAt(hazard.x) - 12;
          if (Math.abs(car.x - hazard.x) < 52 && car.y + 20 > y) crash("The smoke pit swallowed the pig car.");
        } else if (hazard.type === "signature") {
          const signatureHeights = { snowdrift: 24, icepatch: 8, whiteout: 58, crystal: 72, flame: 48, pan: 42, steam: 52, water: 18, spark: 34, ember: 24, lava: 38, firestorm: 62, coal: 22, smokering: 48, lowSmoke: 28, smokepillar: 64, smokefinale: 44, plate: 30, foot: 70, palm: 58, stomp: 42, hand: 90 };
          const obstacleHeight = signatureHeights[hazard.signature] || 30;
          const obstacleY = terrainAt(hazard.x) - obstacleHeight;
          const requiresSquat = hazard.signature === "whiteout" || hazard.signature === "smokepillar";
          let touches;
          if (hazard.signature === "water") {
            const poolAngle = slopeAt(hazard.x), dx = car.x - hazard.x, dy = car.y - (terrainAt(hazard.x) - 10);
            const localX = dx * Math.cos(poolAngle) + dy * Math.sin(poolAngle);
            const localY = -dx * Math.sin(poolAngle) + dy * Math.cos(poolAngle);
            touches = Math.abs(localX) < 42 && Math.abs(localY) < 18;
          } else {
            touches = Math.abs(car.x - hazard.x) < 26 && car.y + 20 > obstacleY && car.y - 20 < terrainAt(hazard.x);
          }
          if (touches && (!requiresSquat || !car.squat)) crash("The " + hazard.signature + " obstacle caught the pig car.");
        }
      }
      if (world.hazard === "hand" && levelInWorld(selectedLevel) === 5) {
        const cycle = 240, phase = bossTimer % cycle, side = Math.floor(bossTimer / cycle) % 2;
        const handX = side === 0 ? 86 : innerWidth - 86;
        const slamY = phase < 48 ? -170 + phase / 48 * (innerHeight * .62) : phase < 84 ? innerHeight * .62 : -170;
        if (phase < 84 && Math.abs(carScreenX - handX) < 105 && car.y < slamY + 150) crash("The giant hand slammed the pig car.");
      }
    }

    function update() {
      if (!playing || car.crashed || car.won) return;
      const forward = keys.has("ArrowRight") || keys.has("KeyD"), backward = keys.has("ArrowLeft") || keys.has("KeyA");
      const squat = keys.has("ArrowDown") || keys.has("KeyS");
      const groundBeforeMove = terrainAt(car.x) - 13;
      const touchingGround = car.grounded || car.y >= groundBeforeMove - 12;
      if (jumpQueued && touchingGround) {
        car.vy = -8.9 - Math.min(1.2, Math.max(0, car.vx) * .035);
        car.grounded = false; car.airtime = 0;
        particleBurst(car.x - 15, car.y + 20, 8);
      }
      jumpQueued = false;
      car.squat = squat;
      if (forward) car.vx += car.grounded ? .20 : .075;
      if (backward) car.vx -= car.grounded ? .13 : .045;
      car.vx *= car.grounded ? .991 : .997;
      car.vx = Math.max(-4.5, Math.min(11, car.vx));
      car.wheelSpin += car.vx * .14;
      car.vy += .28; car.x += car.vx; car.y += car.vy;
      const front = terrainAt(car.x + 22) - 13, rear = terrainAt(car.x - 22) - 13, ground = (front + rear) / 2;
      if (car.y >= ground) {
        const target = Math.atan2(front - rear, 44);
        const landingTilt = Math.abs(normalizeAngle(car.angle - target));
        if (landingTilt > 2.35) crash("The pig car landed off its wheels. Try another flip.");
        if (!car.grounded && Math.abs(car.vy) > 2.5) {
          particleBurst(car.x, ground, 9);
          if (car.airtime > 35) shake = Math.min(8, Math.abs(car.vy) * 1.4);
        }
        car.y = ground; car.vy = 0; car.angle = target; car.spin = 0; car.grounded = true; car.airtime = 0;
      }
      else {
        car.grounded = false; car.airtime += 1;
        if (forward) car.spin += .022;
        if (backward) car.spin -= .022;
        car.spin *= .995;
        car.spin = Math.max(-.20, Math.min(.20, car.spin));
        car.angle += car.spin;
      }
      cameraX += (Math.max(0, car.x - innerWidth * .31) - cameraX) * .09;
      if (car.grounded && Math.abs(car.vx) > 7 && Math.random() < .25) particleBurst(car.x - 28, car.y + 20, 1);
      bossTimer += worlds[worldForLevel(selectedLevel)].hazard === "hand" ? 1 : 0;
      checkHazards(cameraX);
      if (car.y > innerHeight + 200 || car.x < 20) crash("That landing scrambled the pig car. Pick a course and try again.");
      if (car.x >= finish) { car.won = true; particleBurst(car.x, car.y, 55, "win"); shake = 5; unlockNextLevel(); setTimeout(() => showMenu(isDaily ? "Daily challenge cleared. Come back tomorrow for a new course." : unlockedLevel > selectedLevel ? "Level cleared. The next course is unlocked." : "Level cleared. Choose another course, or take on today’s challenge."), 700); }
    }

    function draw() {
      if (shake > .2) { context.save(); context.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); }
      const world = worlds[worldForLevel(selectedLevel)], view = cameraX, ground = Math.round(innerHeight * .72);
      const sky = context.createLinearGradient(0, 0, 0, innerHeight);
      if (world.hazard === "icicle") { sky.addColorStop(0, "#5d9bd1"); sky.addColorStop(.7, "#dff7ff"); }
      else if (world.hazard === "butter") { sky.addColorStop(0, "#e98643"); sky.addColorStop(.7, "#ffe4a8"); }
      else if (world.hazard === "fireball") { sky.addColorStop(0, "#080910"); sky.addColorStop(.7, "#241014"); }
      else if (world.hazard === "scythe") { sky.addColorStop(0, "#171329"); sky.addColorStop(.7, "#74658d"); }
      else if (world.hazard === "smoke") { sky.addColorStop(0, "#403b3a"); sky.addColorStop(.7, "#b8aaa0"); }
      else { sky.addColorStop(0, "#d8927b"); sky.addColorStop(.7, "#ffe0b8"); }
      context.fillStyle = sky; context.fillRect(0, 0, innerWidth, innerHeight);
      if (world.hazard !== "fireball") {
        context.fillStyle = world.hazard === "scythe" ? "#d7c6ff" : world.hazard === "smoke" ? "#d2c5bc" : "#fff0a6";
        context.beginPath(); context.arc(innerWidth * .78, innerHeight * .18, 48, 0, Math.PI * 2); context.fill();
      } else {
        const meteorTime = performance.now() / 1000;
        for (let meteor = 0; meteor < 6; meteor++) {
          const cycle = (meteorTime * (.35 + meteor * .04) + meteor * 1.7) % 5;
          const meteorX = innerWidth * (.1 + ((meteor * .19 + cycle * .11) % .82));
          const meteorY = 70 + ((cycle * 110 + meteor * 47) % (innerHeight * .42));
          context.strokeStyle = "rgba(255, 120, 45, .65)"; context.lineWidth = 4;
          context.beginPath(); context.moveTo(meteorX - 34, meteorY - 28); context.lineTo(meteorX, meteorY); context.stroke();
          context.fillStyle = "#ffcf58"; context.beginPath(); context.arc(meteorX, meteorY, 7, 0, Math.PI * 2); context.fill();
          if (cycle > 4.25) {
            context.strokeStyle = "rgba(255, 80, 20, .75)"; context.lineWidth = 3;
            context.beginPath(); context.arc(meteorX, meteorY, (cycle - 4.25) * 70, 0, Math.PI * 2); context.stroke();
          }
        }
      }
      if (world.hazard === "icicle") {
        context.fillStyle = "rgba(255, 255, 255, .9)";
        context.beginPath();
        context.ellipse(innerWidth * .7, innerHeight * .16, 92, 25, 0, 0, Math.PI * 2);
        context.ellipse(innerWidth * .8, innerHeight * .13, 78, 22, 0, 0, Math.PI * 2);

          else if (hazard.signature === "foot" || hazard.signature === "stomp") { context.fillStyle = "#9f3d43"; context.beginPath(); context.ellipse(0, 10, 25, 48, 0, 0, Math.PI * 2); context.arc(-16, -36, 10, 0, Math.PI * 2); context.arc(0, -43, 10, 0, Math.PI * 2); context.arc(16, -36, 10, 0, Math.PI * 2); context.fill(); }

        }
      });
      if (world.hazard === "hand" && levelInWorld(selectedLevel) === 5) {
        const cycle = 240, phase = bossTimer % cycle, side = Math.floor(bossTimer / cycle) % 2;
        const handX = side === 0 ? 86 : innerWidth - 86;
        const handY = phase < 48 ? -170 + phase / 48 * (innerHeight * .62) : phase < 84 ? innerHeight * .62 : -170;
        context.save(); context.translate(handX, handY); context.fillStyle = "#e99a79"; context.strokeStyle = "#7b303b"; context.lineWidth = 5;

      context.fillStyle = wheelColors[0]; context.beginPath(); context.arc(-20, 18, 13, 0, Math.PI * 2); context.arc(22, 18, 13, 0, Math.PI * 2); context.fill();

      context.fillStyle = "#ff8db6"; context.fillRect(-33, -22, 66, 33); context.fillStyle = "#ffb8cf"; context.fillRect(21, -36, 27, 28); context.fillStyle = "#bd235d"; context.fillRect(43, -25, 12, 10); context.fillRect(24, -47, 8, 14); context.fillRect(40, -47, 8, 14); context.fillStyle = "#15213b"; context.fillRect(41, -36, 4, 4);
