<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #f5f5ff;
      background: radial-gradient(ellipse at top, #201944 0%, #0b0c18 48%, #05060b 100%);
    }
    main {
      width: min(100%, 620px); padding: clamp(28px, 6vw, 52px);
      border: 1px solid #ffffff1c; border-radius: 24px;
      background: #101221d9; box-shadow: 0 24px 90px #0008;
      text-align: center;
    }
    .mark {
      display: grid; place-items: center; width: 58px; height: 58px;
      margin: 0 auto 24px; border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      font-size: 25px; font-weight: 800;
    }
    .eyebrow { color: #a5a7ff; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.04em; }
    p { color: #b8bbd0; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">T</div>
    <div class="eyebrow">Website unavailable</div>
    <h1>This site is offline.</h1>
    <p>This website is no longer being published for visitors.</p>
  </main>
</body>
</html>
