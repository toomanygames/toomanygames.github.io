<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DougHub Moved</title>
<link rel="icon" href="DougHub.ico" type="image/x-icon">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Inter, Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 10%, rgba(99,102,241,.22), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(168,85,247,.18), transparent 35%),
        #02040a;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.card {
    width: min(600px, 100%);
    padding: 45px 35px;
    text-align: center;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(13,17,39,.78);
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
}

.logo {
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 25px;
}

.logo span {
    color: #6366f1;
}

h1 {
    margin: 0 0 15px;
    font-size: 30px;
}

p {
    margin: 0 0 25px;
    color: #aeb4c7;
    font-size: 16px;
    line-height: 1.6;
}

a {
    display: inline-block;
    padding: 13px 22px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    text-decoration: none;
    font-weight: 800;
    box-shadow: 0 10px 25px rgba(99,102,241,.25);
    transition: transform .2s, box-shadow .2s;
}

a:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(99,102,241,.35);
}
</style>
</head>

<body>

<div class="card">
    <div class="logo">
        Doug<span>Hub</span>
    </div>

    <h1>DougHub has moved!</h1>

    <p>
        DougHub has moved to a different domain.
        Please use the new website to access DougHub.
    </p>

    <a href="https://doughub.online">
        Go to the new domain here →
    </a>
</div>

</body>
</html>
