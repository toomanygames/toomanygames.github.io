<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DougHub Moved</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(circle at top, #171d4d 0%, #080a18 45%, #02040a 100%);
  color: white;
  padding: 20px;
}

.card {
  width: min(650px, 100%);
  padding: 50px 35px;
  text-align: center;
  border: 1px solid rgba(139, 92, 246, 0.35);
  border-radius: 24px;
  background: rgba(13, 17, 39, 0.85);
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(15px);
}

.logo {
  font-size: 42px;
  font-weight: 900;
  margin-bottom: 25px;
}

.logo span {
  color: #a855f7;
}

h1 {
  font-size: 34px;
  margin: 0 0 15px;
}

p {
  color: #b8bdd6;
  font-size: 17px;
  line-height: 1.6;
  margin-bottom: 30px;
}

a {
  display: inline-block;
  padding: 14px 24px;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  color: white;
  text-decoration: none;
  font-weight: 800;
  transition: 0.2s;
}

a:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(139, 92, 246, 0.35);
}
</style>
</head>

<body>
  <div class="card">
    <div class="logo">Doug<span>Hub</span></div>

    <h1>DougHub has moved!</h1>

    <p>
      DougHub has moved to a different domain.
      Please use the new website to continue using DougHub.
    </p>

    <a href="https://doughub.online">
      Go to the new domain here →
    </a>
  </div>
</body>
</html>
